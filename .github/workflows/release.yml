name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Nama produk baru; Cargo binary mengdep tetap dipetakan ke mengploy saat packaging.
  PRODUCT_NAME: mengploy

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          archive="${PRODUCT_NAME}-${version}-${{ matrix.target }}.tar.gz"
          mkdir -p package
          cp "target/${{ matrix.target }}/release/mengdep" package/${PRODUCT_NAME}
          chmod 0755 package/${PRODUCT_NAME}
          tar -C package -czf "${archive}" "${PRODUCT_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            mengploy-*.tar.gz
            mengploy-*.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create combined checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cat ./*.sha256 > checksums.txt
          rm -f ./*.sha256
          test -s checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
